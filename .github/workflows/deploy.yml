# Сборка и публикация на GitHub Pages при каждом пуше в main.
# Перед первым запуском: Settings → Pages → Source: GitHub Actions.
#
# Переменные репозитория (Settings → Secrets and variables → Actions → Variables):
#   BASE_PATH          — путь приложения на сайте. Без своего домена не задавать
#                        (будет /<репозиторий>/), со своим доменом — «/».
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY — необязательно, в коде есть значения по умолчанию.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Не отменяем идущий деплой, но и не запускаем два одновременно
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      # GitHub Pages не умеет отдавать index.html на любой адрес (как rewrites в vercel.json):
      # прямой заход на /months/... получит 404.html, который и есть приложение
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
